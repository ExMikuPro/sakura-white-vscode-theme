name: Validate and package
on:
  push:
    branches: [main, 'EXP/**']
  pull_request:
permissions:
  contents: read
jobs:
  theme:
    name: theme (${{ matrix.os }}, ${{ matrix.vscode }})
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, vscode: stable }
          - { os: macos-latest, vscode: stable }
          - { os: windows-latest, vscode: stable }
          - { os: ubuntu-latest, vscode: '1.85.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:grammar
      - run: npm run package
      - run: npm run check:package
      - name: Installation test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Installation test (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:integration
      - uses: actions/upload-artifact@v4
        with:
          name: sakura-white-${{ runner.os }}-${{ matrix.vscode }}
          path: |
            dist/*.vsix
            dist/*-report.json
          if-no-files-found: error
